<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kurs">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Kurs</title>
<style>
:root{
 --bg:#f2f2f7;--card:#fff;--fg:#000;--sec:#3c3c4399;--sep:#3c3c434a;--acc:#007aff;--org:#ff9500;
 --key:#fff;--keyp:#d1d1d6;--keyfn:#e5e5ea;--sh:0 1px 0 #0000002e;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#000;--card:#1c1c1e;--fg:#fff;--sec:#ebebf599;--sep:#54545899;--acc:#0a84ff;--org:#ff9f0a;
 --key:#2c2c2e;--keyp:#48484a;--keyfn:#1c1c1e;--sh:none;
}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);
 font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;touch-action:manipulation;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
body.scam{--acc:var(--org)}
.wrap{flex:1;min-height:0;overflow:auto;padding:0 16px 8px;max-width:520px;width:100%;margin:0 auto}
nav{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 4px 10px}
h1{font-size:34px;font-weight:700;letter-spacing:.01em}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);color:var(--acc);display:grid;place-items:center;margin-bottom:4px}
.ib svg{width:20px;height:20px}
.ib.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.grp{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:66px;position:relative;transition:background .15s}
.row+.row::before{content:"";position:absolute;top:0;left:64px;right:0;height:.5px;background:var(--sep)}
.row:active{background:var(--keyfn)}
.flag{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none}
.nm{flex:none}.nm b{display:block;font-size:17px;font-weight:600}.nm small{font-size:13px;color:var(--sec)}
.val{flex:1;min-width:0;text-align:right;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.val.sm{font-size:22px}.val.xs{font-size:18px}
.row.on .val{color:var(--acc)}
.row.on .val::after{content:"";display:inline-block;width:2px;height:.95em;background:var(--acc);margin-left:2px;vertical-align:-.12em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.ph{color:var(--sec)}
.hdr{font-size:13px;color:var(--sec);text-transform:uppercase;padding:22px 16px 7px}
.ft{font-size:13px;color:var(--sec);padding:7px 16px 0;line-height:1.45}
.ft b{font-weight:500;color:var(--fg)}
.sw{display:flex;align-items:center;min-height:52px;padding:0 16px;gap:12px}
.sw .t{flex:1}.sw .t small{display:block;font-size:13px;color:var(--sec)}
.sw input{accent-color:#34c759;transform:scale(1.15);transform-origin:right}
.warn{color:var(--org)}
.kp{flex:none;background:var(--keyfn);padding:8px 6px calc(env(safe-area-inset-bottom) + 6px);
 display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
@media (prefers-color-scheme:dark){.kp{background:#151517}}
.kp button{border:0;border-radius:8px;background:var(--key);color:var(--fg);box-shadow:var(--sh);
 height:min(54px,7.2vh);font:400 26px -apple-system,system-ui;display:grid;place-items:center}
.kp button.fn{background:var(--keyfn);font-size:20px}
@media (prefers-color-scheme:dark){.kp button.fn{background:#3a3a3c}}
.kp button.z{grid-column:span 2}
.kp button.p{background:var(--keyp)}
.kp svg{width:26px;height:26px}
#hp{position:absolute;left:-99px;opacity:0;pointer-events:none}
</style></head><body>
<div class="wrap">
 <nav><h1>Kurs</h1>
  <button class="ib" id="ref" aria-label="Odśwież kurs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
 </nav>
 <div class="grp" id="list">
  <div class="row" data-c="ALL"><div class="flag">🇦🇱</div><div class="nm"><b>ALL</b><small>Lek albański</small></div><div class="val" id="vALL"></div></div>
  <div class="row" data-c="PLN"><div class="flag">🇵🇱</div><div class="nm"><b>PLN</b><small>Złoty</small></div><div class="val" id="vPLN"></div></div>
  <div class="row" data-c="EUR"><div class="flag">🇪🇺</div><div class="nm"><b>EUR</b><small>Euro</small></div><div class="val" id="vEUR"></div></div>
 </div>
 <div class="ft" id="cross"></div>
 <div class="hdr">Opcje</div>
 <div class="grp"><label class="sw"><span class="t">Ściemokurs<small>100 ALL = 1 EUR</small></span><input type="checkbox" switch id="scam"></label></div>
 <div class="ft" id="src"></div>
</div>
<div class="kp" id="kp">
 <button>1</button><button>2</button><button>3</button><button class="fn" data-k="C">C</button>
 <button>4</button><button>5</button><button>6</button><button class="fn" data-k="B" aria-label="Usuń"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="m12 9.5 5 5m0-5-5 5"/></svg></button>
 <button>7</button><button>8</button><button>9</button><button class="fn" data-k="N" aria-label="Następna waluta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16m0 0-4-4m4 4 4-4M17 20V4m0 0-4 4m4-4 4 4"/></svg></button>
 <button class="z">0</button><button>000</button><button class="fn" data-k="," style="font-size:30px;padding-bottom:8px">,</button>
</div>
<label id="hp"><input type="checkbox" switch></label>
<script>
var FB={EUR:1,PLN:4.25,ALL:97.0,t:0,s:'wbudowany (przybliżony)'};
var R=FB,C=['ALL','PLN','EUR'],act='ALL',buf='',fresh=false,scam=false;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
try{var c=JSON.parse(ls('kurs'));if(c&&c.PLN&&c.ALL)R=c}catch(e){}
scam=ls('scam')==='1';if(C.indexOf(ls('act'))>=0)act=ls('act');buf=ls('buf')||'';
function $(i){return document.getElementById(i)}
function K(c){return c==='ALL'&&scam?100:R[c]}
function num(s){var v=parseFloat(String(s).replace(',','.'));return isFinite(v)?v:NaN}
function grp(i){return i.replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function showBuf(b){var p=b.split(',');return grp(p[0]||'0')+(p.length>1?','+p[1]:'')}
function fmt(v,c){var d=c==='ALL'?0:2;if(c!=='ALL'&&v!==0&&Math.abs(v)<1)d=4;
 return v.toLocaleString('pl-PL',{minimumFractionDigits:d,maximumFractionDigits:d})}
function n(v,d){return v.toLocaleString('pl-PL',{maximumFractionDigits:d})}
function size(el,t){el.className='val'+(t.length>13?' xs':t.length>10?' sm':'')}
function render(){
 var v=num(buf);
 C.forEach(function(c){var el=$('v'+c),t;
  document.querySelector('.row[data-c='+c+']').classList.toggle('on',c===act);
  if(c===act){t=buf?showBuf(buf):'0';el.textContent=t;size(el,t);if(!buf)el.classList.add('ph');return}
  t=isNaN(v)?'0':fmt(v/K(act)*K(c),c);el.textContent=t;size(el,t);if(isNaN(v))el.classList.add('ph');
 });
 var A=K('ALL');
 $('cross').innerHTML=(scam?'<span class="warn">Ściemokurs aktywny · realnie 1 EUR = '+n(R.ALL,2)+' ALL</span><br>':'')+
  '1 EUR = <b>'+n(A,2)+' ALL</b> = <b>'+n(R.PLN,4)+' PLN</b> · 1 PLN = <b>'+n(A/R.PLN,2)+' ALL</b><br>100 ALL = <b>'+n(100*R.PLN/A,2)+' PLN</b> = <b>'+n(100/A,2)+' EUR</b>';
 var t=R.t?new Date(R.t*1000).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'}):'';
 var old=!R.t||(Date.now()/1000-R.t>3*86400);
 $('src').innerHTML='<span class="'+(old?'warn':'')+'">Kurs '+R.s+(t?', '+t:'')+'</span>';
 document.body.classList.toggle('scam',scam);
 ls('buf',buf);ls('act',act);
}
function haptic(){try{$('hp').click()}catch(e){}}
// Zmiana waluty bazowej: przeliczona wartość staje się buforem, następna cyfra ją zastępuje.
function select(c){if(c===act)return;var v=num(buf);
 buf=isNaN(v)?'':fmt(v/K(act)*K(c),c).replace(/ |\s/g,'');
 if(buf.indexOf(',')>=0)buf=buf.replace(/0+$/,'').replace(/,$/,'');
 act=c;fresh=true;render()}
function key(k){haptic();
 if(k==='C'){buf='';fresh=false}
 else if(k==='B'){buf=fresh?'':buf.slice(0,-1);fresh=false}
 else if(k==='N'){select(C[(C.indexOf(act)+1)%3]);return}
 else{if(fresh){buf='';fresh=false}
  if(k===','){if(act==='ALL'||buf.indexOf(',')>=0)return;buf=(buf||'0')+','}
  else{var p=buf.split(',');if(p[1]!==undefined&&p[1].length+k.length>2)return;
   if(p[0].length+k.length>12&&p[1]===undefined)return;
   buf=(buf==='0'?'':buf)+k;if(/^0+$/.test(buf))buf='0'}}
 render()}
function load(){$('ref').classList.add('spin');
 var ac=window.AbortController?new AbortController():null,to=setTimeout(function(){ac&&ac.abort()},6000);
 fetch('https://open.er-api.com/v6/latest/EUR',ac?{signal:ac.signal,cache:'no-store'}:{cache:'no-store'})
 .then(function(r){return r.json()}).then(function(j){
  if(j.result!=='success'||!j.rates.PLN||!j.rates.ALL)throw 0;
  R={EUR:1,PLN:j.rates.PLN,ALL:j.rates.ALL,t:j.time_last_update_unix,s:'online'};ls('kurs',JSON.stringify(R))})
 .catch(function(){}).then(function(){clearTimeout(to);$('ref').classList.remove('spin');render()})}
document.querySelectorAll('.kp button').forEach(function(b){
 b.addEventListener('touchstart',function(){b.classList.add('p')},{passive:true});
 b.addEventListener('touchend',function(){b.classList.remove('p')});
 b.addEventListener('touchcancel',function(){b.classList.remove('p')});
 b.addEventListener('click',function(){key(b.dataset.k||b.textContent)})});
document.querySelectorAll('.row').forEach(function(r){r.addEventListener('click',function(){haptic();select(r.dataset.c)})});
$('scam').checked=scam;
$('scam').addEventListener('change',function(){scam=this.checked;ls('scam',scam?'1':'0');render()});
$('ref').addEventListener('click',function(){haptic();load()});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&R.t&&Date.now()/1000-R.t>6*3600)load()});
document.addEventListener('gesturestart',function(e){e.preventDefault()});
render();load();
</script></body></html>
