<title>Kurs</title>
<style>
:root{
 --bg:#f2f2f7;--fg:#000;--sec:rgba(60,60,67,.6);--ter:rgba(60,60,67,.3);--sep:rgba(60,60,67,.18);
 --acc:#007aff;--org:#ff9500;--ok:#34c759;--del:#ff3b30;
 --gl:rgba(255,255,255,.66);--glb:rgba(255,255,255,.9);--glfn:rgba(214,214,222,.6);--hi:rgba(255,255,255,.95);
 --seg:rgba(118,118,128,.12);--thumb:#fff;--shk:0 10px 22px -14px rgba(0,0,0,.35);--rowbg:#f2f2f7;
 --red:rgba(228,30,32,.22);--blu:rgba(0,122,255,.10);--o1:rgba(255,149,0,.30);--o2:rgba(255,59,48,.12);
 --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
 --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
 --kh:58px;--sh:rgba(246,246,249,.94);
}
@media (prefers-color-scheme:dark){:root{
 --bg:#000;--fg:#fff;--sec:rgba(235,235,245,.6);--ter:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);
 --acc:#0a84ff;--org:#ff9f0a;--ok:#30d158;--del:#ff453a;
 --gl:rgba(255,255,255,.10);--glb:rgba(255,255,255,.13);--glfn:rgba(255,255,255,.2);--hi:rgba(255,255,255,.16);
 --sh:rgba(30,30,32,.94);
 --seg:rgba(118,118,128,.24);--thumb:#636366;--shk:none;--rowbg:#000;
 --red:rgba(228,30,32,.34);--blu:rgba(10,132,255,.14);--o1:rgba(255,159,10,.34);--o2:rgba(255,69,58,.16);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{background:var(--bg)}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;flex-direction:column;color:var(--fg);font:17px/1.3 var(--sys);
 touch-action:manipulation;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);-webkit-font-smoothing:antialiased}
body.scam{--acc:var(--org)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* Tło: miękka poświata w kolorach flagi; w trybie ściemy przechodzi w pomarańcz */
.amb{position:fixed;inset:0;pointer-events:none}
.amb i{position:absolute;inset:0;transition:opacity .7s ease}
.amb .r{background:radial-gradient(110% 55% at 0% 0%,var(--red),transparent 62%),radial-gradient(80% 45% at 100% 18%,var(--blu),transparent 60%)}
.amb .o{opacity:0;background:radial-gradient(110% 55% at 0% 0%,var(--o1),transparent 62%),radial-gradient(80% 45% at 100% 18%,var(--o2),transparent 60%)}
body.scam .amb .r{opacity:0}body.scam .amb .o{opacity:1}

.app{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto}
.glass{background:var(--gl);border:.5px solid var(--glb);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
 box-shadow:inset 0 1px 0 var(--hi),var(--shk)}

header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px 6px}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n,2),1fr);height:36px;padding:2px;border-radius:18px;background:var(--seg)}
.seg button{position:relative;z-index:1;font-size:14px;font-weight:500;border-radius:16px;transition:color .25s}
.seg button[aria-selected=true]{font-weight:600}
.seg .th{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n,2));border-radius:16px;background:var(--thumb);
 box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .38s cubic-bezier(.3,1.25,.5,1);transform:translateX(calc(100% * var(--i,0)))}
#mode{width:236px}
body.scam #mode{--i:1}
body.scam #mode button[data-m="1"]{color:var(--org)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--acc)}
.ib svg{width:20px;height:20px}
.ib.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

.panes{position:relative;flex:1;min-height:0}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.pane[hidden]{display:none!important}
.pane.in{animation:pin .32s cubic-bezier(.3,1.2,.5,1)}
@keyframes pin{from{opacity:0;transform:translateX(calc(var(--dx,1) * 18px))}}

/* --- Przelicz --- */
.disp{padding:6px 20px 0}
.cur{display:flex;align-items:baseline;gap:12px;min-height:50px;padding:4px 0;border-top:.5px solid var(--sep);transition:transform .18s}
.cur:first-child{border-top:0}
.cur.hold{transform:scale(.97)}
.cur,.inp .v,.big{touch-action:none}
.lab{flex:none;display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:var(--sec);transition:color .25s}
.fl{font-size:19px;line-height:1}
.num{flex:1;min-width:0;text-align:right;white-space:nowrap;overflow:hidden;font-family:var(--disp);font-variant-numeric:tabular-nums;
 font-size:32px;font-weight:400;letter-spacing:-.01em;line-height:1.2}
.cur.on{padding:2px 0 6px}
.cur.on .lab{color:var(--acc)}
.cur.on .num{font-weight:200;font-size:66px;letter-spacing:-.035em;line-height:1.1;animation:pop .3s cubic-bezier(.3,1.3,.5,1)}
@keyframes pop{from{opacity:.35;transform:translateY(6px)}}
.ph{color:var(--ter)!important}

.meta{padding:12px 20px 0;font-size:13px;line-height:1.5;color:var(--sec)}
.meta b{font-weight:500;color:var(--fg)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:7px;vertical-align:1px}
.dot.old{background:var(--org)}
.meta .w{color:var(--org)}
.sp{flex:1;min-height:8px}

.tv{margin:0 16px 12px;padding:11px 15px 12px;border-radius:22px;transition:opacity .22s}
.tv.f{opacity:0}
.tvh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:600;color:var(--acc);margin-bottom:3px}
.tvh span:last-child{font-weight:400;color:var(--ter);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.tv p{font-size:14px;line-height:1.4;height:calc(3 * 1.4em);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.tv a{color:var(--acc);text-decoration:none}

/* --- Suma --- */
.tot{flex:none;padding:4px 20px 0}
.big{display:flex;align-items:baseline;gap:10px;transition:transform .18s}
.big.hold{transform:scale(.97)}
.big .lab{color:var(--sec)}
.big .num{font-weight:200;font-size:60px;letter-spacing:-.035em;line-height:1.12}
.big .cc{flex:none;font-size:17px;font-weight:600;color:var(--acc)}
.big.bump .num{animation:pop .3s cubic-bezier(.3,1.3,.5,1)}
.alt{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.chip{white-space:nowrap;flex:none;height:32px;padding:0 12px;border-radius:16px;font-size:15px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.chip .fl{font-size:15px}
.alt.nf .fl{display:none}.alt.sm .chip{font-size:13px;padding:0 9px}

.th2{flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 20px 4px;font-size:13px;color:var(--sec);min-height:34px}
.th2 button{font-size:15px;color:var(--acc);padding:4px 0 4px 12px;transition:color .2s}
.th2 button.cf{color:var(--del);font-weight:600}
.tape{flex:1;min-height:0;margin:0 16px;border-radius:22px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:12px 28px;font-size:15px;line-height:1.45;color:var(--sec)}
.ent{position:relative;overflow:hidden}
.ent+.ent::before{content:"";position:absolute;z-index:1;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
/* Wiersz + ukryty przycisk „Usuń” po prawej, przesuwane razem (bez nieprzezroczystego tła pod tekstem). */
.ent .tr{display:flex;width:calc(100% + 88px);transition:transform .3s cubic-bezier(.3,1.2,.5,1)}
.ent.drag .tr{transition:none}
.ent .del{flex:0 0 88px;background:var(--del);color:#fff;font-size:15px;font-weight:600;display:grid;place-items:center}
.ent .in{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;padding:12px 16px}
.ent .a{font-size:17px;font-variant-numeric:tabular-nums}
.ent .a.neg{color:var(--del)}
.ent .c{font-size:13px;font-weight:600;color:var(--sec)}
.ent .eq{margin-left:auto;font-size:15px;color:var(--sec);font-variant-numeric:tabular-nums;white-space:nowrap}
.ent.new{animation:ein .35s cubic-bezier(.3,1.3,.5,1)}
@keyframes ein{from{opacity:0;transform:translateY(-12px) scale(.97)}}
.ent.out{transition:opacity .2s,max-height .25s .1s;max-height:0!important;opacity:0}

.inp{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px 10px}
#icur{--n:3;width:174px;flex:none}
#icur button{font-size:13px}
body #icur{--i:var(--ii,0)}
.inp .v{flex:1;min-width:0;text-align:right;white-space:nowrap;overflow:hidden;font-family:var(--disp);font-size:34px;font-weight:300;
 color:var(--acc);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.inp .v::after{content:"";display:inline-block;width:2px;height:.85em;background:var(--acc);margin-left:3px;vertical-align:-.08em;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.inp.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* --- Klawiatura --- */
.kp{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px;padding:2px 16px 10px}
.kp button{height:var(--kh);border-radius:999px;font-family:var(--disp);font-size:30px;font-weight:400;display:grid;place-items:center;
 transition:transform .2s cubic-bezier(.3,1.5,.5,1),filter .2s}
.kp button.p{transform:scale(.92);filter:brightness(.88)}
@media (prefers-color-scheme:dark){.kp button.p{filter:brightness(1.6)}}
.kp .fn{background:var(--glfn);font-size:22px}
.kp .ac{background:var(--acc);border-color:transparent;color:#fff;box-shadow:0 10px 20px -12px var(--acc)}
.kp .z{grid-column:span 2}
.kp .k3{font-size:25px;letter-spacing:.04em}
.kp .op{font-size:36px;font-weight:300}
.kp svg{width:25px;height:25px}

/* --- Pasek kart (iOS 26: pływająca kapsuła) --- */
.tabs{flex:none;position:relative;display:grid;grid-template-columns:1fr 1fr;width:224px;height:58px;padding:4px;border-radius:29px;
 margin:2px auto calc(env(safe-area-inset-bottom) + 6px)}
.gap .tabs{margin-bottom:8px}
.tabs .th{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:25px;background:var(--seg);
 transition:transform .4s cubic-bezier(.3,1.25,.5,1)}
.tabs.t1 .th{transform:translateX(100%)}
.tabs button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;transition:color .25s}
.tabs button[aria-selected=true]{color:var(--acc)}
.tabs svg{width:24px;height:24px}

.lnk{font:inherit;color:var(--acc);padding:6px 4px;margin:-6px 0}
.dim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.dim.on{opacity:1;pointer-events:auto}
.sheet.glass{background:var(--sh);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.sheet{position:fixed;z-index:21;left:8px;right:8px;bottom:8px;max-width:504px;margin:0 auto;border-radius:34px;padding:8px 20px calc(env(safe-area-inset-bottom) + 16px);
 text-align:center;transform:translateY(calc(100% + 16px));transition:transform .42s cubic-bezier(.3,1.15,.5,1)}
.gap .sheet{padding-bottom:16px}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--ter);margin:0 auto 14px}
.sheet h2{font-size:17px;font-weight:600}
.sheet .sub{font-size:15px;color:var(--sec);margin-top:2px}
.stp{display:flex;align-items:center;justify-content:center;gap:22px;margin:18px 0 6px}
.stp .rb{width:56px;height:56px;border-radius:50%;font-size:30px;font-weight:300;color:var(--acc);display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.stp .rb.p{transform:scale(.9)}
.stp .val{min-width:150px;font-family:var(--disp);font-size:64px;font-weight:200;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.stp .val small{font-size:17px;font-weight:600;color:var(--acc);letter-spacing:0;margin-left:6px}
.pre{display:flex;justify-content:center;gap:8px;margin:14px 0 6px}
.pre button{height:34px;padding:0 16px;border-radius:17px;font-size:15px;font-weight:500;background:var(--seg)}
.pre button[aria-pressed=true]{background:var(--acc);color:#fff}
.sheet .ex{font-size:13px;color:var(--sec);line-height:1.5;margin:10px 0 16px}
.sheet .ex b{color:var(--fg);font-weight:500}
.done{width:100%;height:52px;border-radius:26px;background:var(--acc);color:#fff;font-size:17px;font-weight:600}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);z-index:9;padding:10px 18px;border-radius:999px;font-size:15px;font-weight:500;
 opacity:0;transform:translate(-50%,-14px) scale(.96);transition:opacity .25s,transform .35s cubic-bezier(.3,1.3,.5,1);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.on.act{pointer-events:auto}
.toast .tact{color:var(--acc);font-weight:600;margin-left:16px;padding:6px 0;margin-block:-6px}
#hp{position:absolute;left:-99px;opacity:0;pointer-events:none}

/* Układ dopasowywany w JS (fitLayout) do faktycznej wysokości, z uwzględnieniem wyspy i paska Home. */
.c1 header{padding-top:2px;padding-bottom:4px}
.tight .disp{padding-top:2px}
.tight .cur{min-height:42px}.tight .cur .num{font-size:28px}.tight .meta{padding-top:6px}
.tight .tv{margin-bottom:10px;padding:9px 14px 10px}.tight .tv p{height:calc(2 * 1.4em);-webkit-line-clamp:2}
.tight .kp{gap:8px 12px}
.c1 .tabs{height:52px;border-radius:26px}.c1 .tabs .th{border-radius:22px}.c1 .tabs svg{width:22px;height:22px}
.tight .big .num{font-size:48px}.tight .inp{padding:6px 16px 8px}.tight .inp .v{font-size:30px}.tight .th2{padding-top:4px;min-height:30px}
.notv .tv{display:none}
/* Poziomo: treść po lewej połowie, klawiatura (i pole wpisywania Sumy) przypięte w prawej połowie. */
.land .app{max-width:860px}
.land .pane>*{width:50%}
.land .kp{position:absolute;right:0;bottom:0}
.land #p1 .inp{position:absolute;right:0;bottom:calc(4 * var(--kh) + 36px)}
.land #p0 .tv{display:none}
.land #p1 .tape{margin-bottom:10px;width:calc(50% - 32px)}
.land .meta{font-size:12px}
.land .cur.on .num{font-size:48px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head><body>
<div class="amb" aria-hidden="true"><i class="r"></i><i class="o"></i></div>
<div class="app">
 <header>
  <div class="seg" id="mode" role="tablist" aria-label="Kurs przeliczania">
   <i class="th" aria-hidden="true"></i>
   <button role="tab" data-m="0" aria-selected="true">Rynkowy</button>
   <button role="tab" data-m="1" aria-selected="false">Ściemokurs</button>
  </div>
  <button class="ib glass" id="ref" aria-label="Odśwież kurs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
 </header>

 <div class="panes">
  <!-- Przelicz -->
  <section class="pane" id="p0" aria-label="Przelicz">
   <div class="disp" aria-live="polite">
    <div class="cur" data-c="ALL"><div class="lab"><span class="fl">🇦🇱</span>ALL</div><div class="num" id="vALL"></div></div>
    <div class="cur" data-c="PLN"><div class="lab"><span class="fl">🇵🇱</span>PLN</div><div class="num" id="vPLN"></div></div>
    <div class="cur" data-c="EUR"><div class="lab"><span class="fl">🇪🇺</span>EUR</div><div class="num" id="vEUR"></div></div>
   </div>
   <div class="meta"><div id="src"></div><div id="cross"></div></div>
   <div class="sp"></div>
   <div class="tv glass" id="tv" role="button" aria-label="Następna ciekawostka"><div class="tvh"><span>🇦🇱 Czy wiesz, że…</span><span id="tvs"></span></div><p id="tvt"></p></div>
   <div class="kp" data-pad="0">
    <button class="glass" data-k="1">1</button><button class="glass" data-k="2">2</button><button class="glass" data-k="3">3</button><button class="glass fn" data-k="C" aria-label="Wyczyść">C</button>
    <button class="glass" data-k="4">4</button><button class="glass" data-k="5">5</button><button class="glass" data-k="6">6</button>
    <button class="glass fn" data-k="B" aria-label="Usuń cyfrę"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="m12 9.5 5 5m0-5-5 5"/></svg></button>
    <button class="glass" data-k="7">7</button><button class="glass" data-k="8">8</button><button class="glass" data-k="9">9</button>
    <button class="glass ac" data-k="N" aria-label="Następna waluta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16m0 0-4-4m4 4 4-4M17 20V4m0 0-4 4m4-4 4 4"/></svg></button>
    <button class="glass z" data-k="0">0</button><button class="glass k3" data-k="000">000</button><button class="glass fn" data-k="," aria-label="Przecinek" style="font-size:30px">,</button>
   </div>
  </section>

  <!-- Suma -->
  <section class="pane" id="p1" aria-label="Suma" hidden>
   <div class="tot">
    <div class="big" id="big" aria-label="Suma"><div class="num" id="sBig"></div><div class="cc" id="sCc"></div></div>
    <div class="alt" id="alt"></div>
   </div>
   <div class="th2" id="th2"><span id="cnt"></span><button id="clr">Wyczyść</button></div>
   <div class="tape glass" id="tape"></div>
   <div class="inp" id="inp">
    <div class="seg" id="icur" role="tablist" aria-label="Waluta pozycji">
     <i class="th" aria-hidden="true"></i>
     <button role="tab" data-c="ALL">ALL</button><button role="tab" data-c="PLN">PLN</button><button role="tab" data-c="EUR">EUR</button>
    </div>
    <div class="v" id="iv"></div>
   </div>
   <div class="kp" data-pad="1">
    <button class="glass" data-k="1">1</button><button class="glass" data-k="2">2</button><button class="glass" data-k="3">3</button><button class="glass fn" data-k="C" aria-label="Wyczyść kwotę">C</button>
    <button class="glass" data-k="4">4</button><button class="glass" data-k="5">5</button><button class="glass" data-k="6">6</button>
    <button class="glass fn" data-k="B" aria-label="Usuń cyfrę"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="m12 9.5 5 5m0-5-5 5"/></svg></button>
    <button class="glass" data-k="7">7</button><button class="glass" data-k="8">8</button><button class="glass" data-k="9">9</button>
    <button class="glass fn op" data-k="-" aria-label="Odejmij od sumy">−</button>
    <button class="glass" data-k="0">0</button><button class="glass k3" data-k="000">000</button><button class="glass fn" data-k="," aria-label="Przecinek" style="font-size:30px">,</button>
    <button class="glass ac op" data-k="+" aria-label="Dodaj do sumy">+</button>
   </div>
  </section>
 </div>

 <nav class="tabs glass" id="tabs" role="tablist" aria-label="Widok">
  <i class="th" aria-hidden="true"></i>
  <button role="tab" data-t="0" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h15m0 0-4-4m4 4-4 4M20 16H5m0 0 4-4m-4 4 4 4"/></svg>Przelicz</button>
  <button role="tab" data-t="1" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z"/><path d="M9.5 8h5M9.5 12h5M9.5 16h3"/></svg>Suma</button>
 </nav>
</div>
<div class="dim" id="dim"></div>
<div class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" aria-hidden="true">
 <div class="grab"></div>
 <h2 id="shT">Ściemokurs</h2>
 <div class="sub">Ile leków liczą za 1 euro</div>
 <div class="stp">
  <button class="rb glass" data-d="-1" aria-label="Mniej leków za euro">−</button>
  <div class="val" aria-live="polite"><span id="srV"></span><small>ALL</small></div>
  <button class="rb glass" data-d="1" aria-label="Więcej leków za euro">+</button>
 </div>
 <div class="pre" id="srPre"><button data-v="90">90</button><button data-v="95">95</button><button data-v="100">100</button></div>
 <div class="ex" id="srEx"></div>
 <button class="done" id="srDone">Gotowe</button>
</div>
<div class="toast glass" id="toast" role="status"></div>
<label id="hp"><input type="checkbox" switch></label>
<script>
// Kurs wbudowany (13.10.2026), tylko gdy nigdy nie udało się pobrać kursu.
var FB={EUR:1,PLN:4.387,ALL:91.55,t:0};
var R=FB,C=['ALL','PLN','EUR'],FL={ALL:'🇦🇱',PLN:'🇵🇱',EUR:'🇪🇺'},scam=false,tab=0;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function lj(k){try{return JSON.parse(ls(k))}catch(e){return null}}
var c0=lj('kurs');if(c0&&c0.PLN&&c0.ALL)R=c0;
scam=ls('scam')==='1';tab=ls('tab')==='1'?1:0;
// Kurs „ściemy”: ile leków liczą za 1 EUR (domyślnie 90, ustawialny 50–150).
var SR=+ls('sr');if(!(SR>=50&&SR<=150))SR=90;
function $(i){return document.getElementById(i)}
function K(c){return c==='ALL'&&scam?SR:R[c]}
function conv(v,from,to){return v/K(from)*K(to)}
function num(s){var v=parseFloat(String(s).replace(',','.'));return isFinite(v)?v:NaN}
function grp(i){return i.replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function showBuf(b){var p=b.split(',');return grp(p[0]||'0')+(p.length>1?','+p[1]:'')}
// Grupowanie tysięcy zawsze spacją (toLocaleString pl-PL nie grupuje liczb 4-cyfrowych, a wpisywana kwota tak).
function fmt(v,c){var d=c==='ALL'?0:2;if(c!=='ALL'&&v!==0&&Math.abs(v)<1)d=4;
 var s=Math.abs(v).toFixed(d).split('.');return (v<0&&+s.join('.')!==0?'-':'')+grp(s[0])+(s[1]?','+s[1]:'')}
// W Sumie zawsze 2 miejsca (0,60 EUR, nie 0,6008 EUR).
function fmtS(v,c){var d=c==='ALL'?0:2,x=Math.abs(v).toFixed(d).split('.');return (v<0&&+x.join('.')!==0?'-':'')+grp(x[0])+(x[1]?','+x[1]:'')}
function n(v,d){return v.toLocaleString('pl-PL',{maximumFractionDigits:d})}
// Dopasowanie rozmiaru liczby do szerokości (jak wyświetlacz Kalkulatora).
function fit(el,max,min){var s=max;el.style.fontSize=s+'px';
 while(el.scrollWidth>el.clientWidth+1&&s>min){s-=2;el.style.fontSize=s+'px'}}
var sm=function(){return document.documentElement.classList.contains('tight')};
function haptic(){try{$('hp').click()}catch(e){}}
function toast(t,act,fn){var e=$('toast');e.textContent=t;
 if(act){var b=document.createElement('button');b.className='tact';b.textContent=act;
  b.addEventListener('click',function(){haptic();fn();e.classList.remove('on')});e.appendChild(b)}
 e.classList.toggle('act',!!act);e.classList.add('on');clearTimeout(toast.t);
 toast.t=setTimeout(function(){e.classList.remove('on')},act?4500:1600)}
function copy(txt,label){var p=navigator.clipboard&&navigator.clipboard.writeText(txt.replace(/[\s ]/g,''));
 if(p)p.then(function(){toast('Skopiowano '+label)},function(){toast('Nie udało się skopiować')});else toast('Nie udało się skopiować')}
// Stuknięcie / przytrzymanie / przesunięcie w poziomie (el._swipe) – jedno miejsce obsługi gestów.
function longPress(el,fn,tap){var t0=0,tm,long=false,mv=false,x0=0,y0=0;
 el.addEventListener('pointerdown',function(e){t0=Date.now();long=false;mv=false;x0=e.clientX;y0=e.clientY;
  tm=setTimeout(function(){if(!mv&&fn){el.classList.add('hold');haptic()}},420)});
 el.addEventListener('pointermove',function(e){if(!mv&&(Math.abs(e.clientX-x0)>10||Math.abs(e.clientY-y0)>10)){mv=true;clearTimeout(tm);el.classList.remove('hold')}});
 el.addEventListener('pointerup',function(e){clearTimeout(tm);el.classList.remove('hold');var dx=e.clientX-x0,dy=e.clientY-y0;
  if(el._swipe&&Math.abs(dx)>36&&Math.abs(dy)<40){long=true;el._swipe();return}
  if(!mv&&fn&&Date.now()-t0>=420){long=true;fn()}});
 el.addEventListener('pointercancel',function(){clearTimeout(tm);el.classList.remove('hold')});
 el.addEventListener('click',function(){if(!long&&!mv&&tap)tap()})}

// Wpisywanie z klawiatury: wspólne zasady dla obu kart (ALL bez groszy, max 2 miejsca po przecinku).
function typeKey(st,k,cur){
 if(k==='C'){st.buf='';st.fresh=false;return true}
 if(k==='B'){st.buf=st.fresh?'':st.buf.slice(0,-1);st.fresh=false;return true}
 if(st.fresh){st.buf='';st.fresh=false}
 if(k===','){if(cur==='ALL'||st.buf.indexOf(',')>=0)return false;st.buf=(st.buf||'0')+',';return true}
 var p=st.buf.split(',');
 if(p[1]!==undefined&&p[1].length+k.length>2)return false;
 if(p[1]===undefined&&p[0].length+k.length>12)return false;
 st.buf=(st.buf==='0'?'':st.buf)+k;if(/^0+$/.test(st.buf))st.buf='0';return true}

/* ===== Przelicz ===== */
var cv={buf:ls('buf')||'',fresh:false,act:C.indexOf(ls('act'))>=0?ls('act'):'ALL'};
function renderConv(){
 var v=num(cv.buf);
 C.forEach(function(c){var el=$('v'+c),on=c===cv.act;
  el.parentNode.classList.toggle('on',on);
  if(on){el.textContent=cv.buf?showBuf(cv.buf):'0';el.classList.toggle('ph',!cv.buf)}
  else{el.textContent=isNaN(v)?'0':fmt(conv(v,cv.act,c),c);el.classList.toggle('ph',isNaN(v))}
  fit(el,on?(sm()?54:66):(sm()?28:32),on?30:18)});
 ls('buf',cv.buf);ls('act',cv.act)}
function selectConv(c){if(c===cv.act)return;var v=num(cv.buf);
 cv.buf=isNaN(v)?'':fmt(conv(v,cv.act,c),c).replace(/[\s ]/g,'');
 if(cv.buf.indexOf(',')>=0)cv.buf=cv.buf.replace(/0+$/,'').replace(/,$/,'');
 cv.act=c;cv.fresh=true;renderConv()}
function keyConv(k){if(k==='N'){selectConv(C[(C.indexOf(cv.act)+1)%3]);return}
 if(typeKey(cv,k,cv.act))renderConv()}
document.querySelectorAll('.cur').forEach(function(r){
 r._swipe=function(){haptic();keyConv('B')};
 longPress(r,function(){copy(r.querySelector('.num').textContent,r.querySelector('.num').textContent+' '+r.dataset.c)},
  function(){haptic();selectConv(r.dataset.c)})});

/* ===== Suma ===== */
var su={buf:'',fresh:false,cur:C.indexOf(ls('icur'))>=0?ls('icur'):'ALL',tot:C.indexOf(ls('tcur'))>=0?ls('tcur'):'ALL',items:lj('items')||[]};
if(!Array.isArray(su.items))su.items=[];
var uid=Date.now();
function total(c){return su.items.reduce(function(s,e){return s+conv(e.v,e.c,c)},0)}
function sgn(v,c){return (v<0?'−':'+')+' '+fmtS(Math.abs(v),c)}
function renderSum(bumpBig){
 var t=total(su.tot),el=$('sBig');
 el.textContent=fmtS(t,su.tot).replace('-','−');el.classList.toggle('ph',!su.items.length);
 $('sCc').textContent=su.tot;
 fit(el,sm()?50:60,26);
 if(bumpBig){var b=$('big');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
 $('alt').style.visibility=su.items.length?'visible':'hidden';
 $('alt').innerHTML=C.filter(function(c){return c!==su.tot}).map(function(c){
  return '<button class="chip glass" data-c="'+c+'" aria-label="Pokaż sumę w '+c+'"><span class="fl">'+FL[c]+'</span>'+fmtS(total(c),c).replace('-','−')+' '+c+'</button>'}).join('');
 // Za wąsko na kapsuły z flagami (duże kwoty, SE, poziomo): najpierw bez flag, potem mniejsze.
 var al=$('alt');al.classList.remove('nf','sm');
 function ovf(){var c=al.firstElementChild;return c&&c.getBoundingClientRect().left<al.getBoundingClientRect().left-1}
 if(ovf())al.classList.add('nf');if(ovf())al.classList.add('sm');
 $('alt').querySelectorAll('.chip').forEach(function(b){b.onclick=function(){haptic();su.tot=b.dataset.c;ls('tcur',su.tot);renderSum(true);renderTape()}});
 var nI=su.items.length;
 $('cnt').textContent=nI?nI+' '+(nI===1?'pozycja':(nI%10>=2&&nI%10<=4&&(nI%100<10||nI%100>=20))?'pozycje':'pozycji'):'';
 $('clr').style.visibility=nI?'visible':'hidden';
 $('iv').textContent=su.buf?showBuf(su.buf):'0';$('iv').classList.toggle('ph',!su.buf);
 fit($('iv'),sm()?30:34,20);
 $('icur').style.setProperty('--ii',C.indexOf(su.cur));
 $('icur').querySelectorAll('button').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.c===su.cur))});
 ls('items',JSON.stringify(su.items));ls('icur',su.cur);ls('tcur',su.tot)}
function rowHTML(e){return '<div class="tr"><div class="in"><span class="a'+(e.v<0?' neg':'')+'">'+sgn(e.v,e.c)+
 '</span><span class="c">'+e.c+'</span>'+(e.c!==su.tot?'<span class="eq">'+fmtS(conv(e.v,e.c,su.tot),su.tot).replace('-','−')+' '+su.tot+'</span>':'')+'</div><button class="del" aria-label="Usuń pozycję">Usuń</button></div>'}
function renderTape(newId){
 var tp=$('tape');
 if(!su.items.length){tp.innerHTML='<div class="empty">Wpisz kwotę i stuknij +, żeby dodać ją do sumy. Każda pozycja może być w innej walucie, a − odejmuje.</div>';return}
 tp.innerHTML='';
 su.items.slice().reverse().forEach(function(e){var d=document.createElement('div');d.className='ent'+(e.id===newId?' new':'');d.dataset.id=e.id;d.innerHTML=rowHTML(e);tp.appendChild(d);swipe(d)});
 tp.scrollTop=0}
// Przesunięcie w lewo odsłania „Usuń” (jak w Wiadomościach/Poczcie).
var openRow=null;
function setX(d,x){d.querySelector('.tr').style.transform=x?'translateX('+x+'px)':''}
function closeOpen(ex){if(openRow&&openRow!==ex){setX(openRow,0);openRow=null}}
function swipe(d){var x0,y0,base=0,dx=0,on=false,dir=0;
 d.addEventListener('pointerdown',function(e){x0=e.clientX;y0=e.clientY;dir=0;dx=0;base=openRow===d?-88:0;closeOpen(d);on=true});
 d.addEventListener('pointermove',function(e){if(!on)return;var mx=e.clientX-x0,my=e.clientY-y0;
  if(!dir){if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)){dir=1;d.classList.add('drag');try{d.setPointerCapture(e.pointerId)}catch(_){}}else if(Math.abs(my)>8){dir=2;on=false;return}}
  if(dir===1){dx=Math.max(-120,Math.min(0,base+mx));setX(d,dx)}});
 function end(){if(!on)return;on=false;d.classList.remove('drag');
  if(dir===1){if(dx<-150){del(d)}else if(dx<-44){setX(d,-88);openRow=d;haptic()}else{setX(d,0);if(openRow===d)openRow=null}}
  else if(dir===0&&openRow===d){setX(d,0);openRow=null}}
 d.addEventListener('pointerup',end);d.addEventListener('pointercancel',function(){on=false;d.classList.remove('drag');setX(d,openRow===d?-88:0)});
 d.querySelector('.del').addEventListener('click',function(e){e.stopPropagation();del(d)})}
function del(d){haptic();var id=+d.dataset.id;openRow=null;d.style.maxHeight=d.offsetHeight+'px';void d.offsetWidth;d.classList.add('out');
 setTimeout(function(){var i=su.items.findIndex(function(e){return e.id===id});if(i<0)return;var e=su.items[i];
  su.items.splice(i,1);renderSum(true);renderTape();
  toast('Usunięto '+sgn(e.v,e.c)+' '+e.c,'Cofnij',function(){su.items.splice(Math.min(i,su.items.length),0,e);renderSum(true);renderTape(e.id)})},330)}
function keySum(k){
 if(k==='+'||k==='-'){var v=num(su.buf);
  if(isNaN(v)||v===0){var i=$('inp');i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake');return}
  var e={id:++uid,v:k==='-'?-v:v,c:su.cur};su.items.push(e);su.buf='';su.fresh=false;
  renderSum(true);renderTape(e.id);return}
 if(typeKey(su,k,su.cur))renderSum()}
$('icur').querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){
 if(b.dataset.c===su.cur)return;haptic();su.cur=b.dataset.c;
 if(su.cur==='ALL'&&su.buf.indexOf(',')>=0)su.buf=su.buf.split(',')[0];renderSum()})});
var clrT;
$('clr').addEventListener('click',function(){var b=$('clr');haptic();
 if(!b.classList.contains('cf')){b.classList.add('cf');b.textContent='Wyczyścić wszystko?';clearTimeout(clrT);
  clrT=setTimeout(function(){b.classList.remove('cf');b.textContent='Wyczyść'},3000);return}
 clearTimeout(clrT);b.classList.remove('cf');b.textContent='Wyczyść';var bak=su.items;su.items=[];renderSum(true);renderTape();
 toast('Wyczyszczono rachunek','Cofnij',function(){su.items=bak;renderSum(true);renderTape()})});
$('iv')._swipe=function(){haptic();keySum('B')};longPress($('iv'));
longPress($('big'),function(){copy($('sBig').textContent,$('sBig').textContent+' '+su.tot)});

/* ===== Wspólne ===== */
function renderMeta(){
 var old=!R.t||(Date.now()/1000-R.t>3*86400);
 $('src').innerHTML='<span class="dot'+(old?' old':'')+'"></span>'+(R.t?'Kurs: '+when(R.t,R.d):'Kurs przybliżony, brak połączenia');
 var A=K('ALL');
 $('cross').innerHTML=(scam?'<span class="w">Ściemokurs: 1 EUR = '+SR+' ALL, rynkowo '+n(R.ALL,2)+'</span> <button class="lnk" data-sr>Zmień</button><br>':'')+
  '1 EUR = <b>'+n(A,2)+' ALL</b> = <b>'+n(R.PLN,4)+' PLN</b>, 1 PLN = <b>'+n(A/R.PLN,2)+' ALL</b>';
 document.body.classList.toggle('scam',scam);
 $('mode').querySelectorAll('button').forEach(function(b){b.setAttribute('aria-selected',String((b.dataset.m==='1')===scam))})}
// „dziś, 02:02” / „wczoraj, 02:02” / „10 października”
function when(t,dateOnly){var d=new Date(t*1000),a=new Date(),day=Math.round((new Date(a.toDateString())-new Date(d.toDateString()))/864e5);
 var w=day===0?'dziś':day===1?'wczoraj':d.toLocaleDateString('pl-PL',{day:'numeric',month:'long'});
 return dateOnly||day>1?w:w+', '+d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}
function renderAll(){renderMeta();renderConv();renderSum();renderTape();if(window.fitLayout)fitLayout()}
function setTab(t,anim){tab=t;ls('tab',String(t));
 [0,1].forEach(function(i){var p=$('p'+i);p.hidden=i!==t;p.classList.remove('in');
  if(i===t&&anim){p.style.setProperty('--dx',t?1:-1);void p.offsetWidth;p.classList.add('in')}});
 $('tabs').classList.toggle('t1',t===1);
 $('tabs').querySelectorAll('button').forEach(function(b){b.setAttribute('aria-selected',String(+b.dataset.t===t))});
 renderConv();renderSum()}
// Kurs: open.er-api.com, a gdy nie działa – currency-api (jsDelivr, potem Cloudflare). Wszystkie z CORS, bez klucza.

 return fetch(u,ac?{signal:ac.signal,cache:'no-store'}:{cache:'no-store'}).then(function(r){clearTimeout(to);if(!r.ok)throw 0;return r.json()},function(e){clearTimeout(to);throw e})}
