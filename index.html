<title>Kurs</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#14171c;--mut:#6b7280;--acc:#0a7cff;--bd:#e3e6ea}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b1f25;--fg:#f2f4f7;--mut:#8b93a0;--acc:#3d9bff;--bd:#2a3039}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px -apple-system,system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 16px)}
h1{font-size:15px;font-weight:600;color:var(--mut);margin:0 4px 12px;letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:6px 6px 6px 16px;margin-bottom:10px}
.row:focus-within{border-color:var(--acc)}
.cc{width:52px;font-weight:700;font-size:18px}
.cc small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:600 30px -apple-system,system-ui;text-align:right;padding:12px 10px;outline:none;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--mut);font-size:22px;padding:8px 12px}
.info{margin:14px 4px 0;font-size:13px;color:var(--mut);line-height:1.6}
.info b{color:var(--fg);font-weight:600}
.st{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
button.r{border:1px solid var(--bd);background:var(--card);color:var(--acc);border-radius:10px;padding:7px 12px;font-size:14px}
.warn{color:#d97706}
.sc{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 16px;margin-bottom:10px;font-size:16px}
.sc input{flex:none;width:22px;height:22px;padding:0;accent-color:#d97706}
.sc small{color:var(--mut);font-size:13px;margin-left:auto}
body.scam .row,body.scam .sc{border-color:#d97706}
</style></head><body><main>
<h1>Kurs · ALL / PLN / EUR</h1>
<div class="row"><div class="cc">ALL<small>lek</small></div><input id="ALL" inputmode="decimal" autocomplete="off" placeholder="0"><button class="x" data-c="ALL">×</button></div>
<div class="row"><div class="cc">PLN<small>złoty</small></div><input id="PLN" inputmode="decimal" autocomplete="off" placeholder="0"><button class="x" data-c="PLN">×</button></div>
<div class="row"><div class="cc">EUR<small>euro</small></div><input id="EUR" inputmode="decimal" autocomplete="off" placeholder="0"><button class="x" data-c="EUR">×</button></div>
<label class="sc"><input type="checkbox" id="scam">Ściemokurs<small>100 ALL = 1 EUR</small></label>
<div class="info" id="cross"></div>
<div class="info st"><span id="src"></span><button class="r" id="ref">Odśwież</button></div>
</main><script>
// Kursy względem 1 EUR. Fallback przybliżony – nadpisywany kursem z API przy starcie.
var FB={EUR:1,PLN:4.25,ALL:97.0,t:0,s:'wbudowany (przybliżony)'};
var R=FB, C=['ALL','PLN','EUR'], last='ALL', scam=false;
// Kurs efektywny: przy ściemokursie lek liczony po 100 za 1 EUR, PLN zostaje realny.
function K(c){return c==='ALL'&&scam?100:R[c]}
try{var c=JSON.parse(localStorage.getItem('kurs'));if(c&&c.PLN&&c.ALL)R=c}catch(e){}
function $(i){return document.getElementById(i)}
function parse(s){s=String(s).replace(/[\s\u00a0]/g,'').replace(',','.');var v=parseFloat(s);return isFinite(v)?v:NaN}
function fmt(v,c){var d=c==='ALL'?0:2;if(c!=='ALL'&&Math.abs(v)<1&&v!==0)d=4;
 return v.toLocaleString('pl-PL',{minimumFractionDigits:d,maximumFractionDigits:d})}
function calc(from){last=from;var v=parse($(from).value);
 C.forEach(function(c){if(c===from)return;$(c).value=isNaN(v)?'':fmt(v/K(from)*K(c),c)})}
function n(v,d){return v.toLocaleString('pl-PL',{maximumFractionDigits:d})}
function info(){
 var A=K('ALL');
 $('cross').innerHTML=(scam?'<span class="warn">Ściemokurs aktywny · realnie 1 EUR = '+n(R.ALL,2)+' ALL</span><br>':'')+'1 EUR = <b>'+n(A,2)+' ALL</b> = <b>'+n(R.PLN,4)+' PLN</b><br>1 PLN = <b>'+n(A/R.PLN,2)+' ALL</b> · 100 ALL = <b>'+n(100*R.PLN/A,2)+' PLN</b> = <b>'+n(100/A,2)+' EUR</b>';
 var t=R.t?new Date(R.t*1000).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'}):'';
 var old=!R.t||(Date.now()/1000-R.t>3*86400);
 $('src').innerHTML='<span class="'+(old?'warn':'')+'">Kurs: '+R.s+(t?' · '+t:'')+'</span>';
}
function load(){$('src').textContent='Pobieram kurs…';
 var ac=window.AbortController?new AbortController():null;var to=setTimeout(function(){ac&&ac.abort()},6000);
 fetch('https://open.er-api.com/v6/latest/EUR',ac?{signal:ac.signal,cache:'no-store'}:{cache:'no-store'})
 .then(function(r){return r.json()}).then(function(j){clearTimeout(to);
  if(j.result!=='success'||!j.rates.PLN||!j.rates.ALL)throw 0;
  R={EUR:1,PLN:j.rates.PLN,ALL:j.rates.ALL,t:j.time_last_update_unix,s:'online'};
  try{localStorage.setItem('kurs',JSON.stringify(R))}catch(e){}
  info();calc(last)})
 .catch(function(){clearTimeout(to);info()})}
C.forEach(function(c){var e=$(c);
 e.addEventListener('input',function(){calc(c)});
 e.addEventListener('focus',function(){setTimeout(function(){e.select()},0)})});
document.querySelectorAll('.x').forEach(function(b){b.addEventListener('click',function(){
 C.forEach(function(c){$(c).value=''});$(b.dataset.c).focus()})});
$('ref').addEventListener('click',load);
try{scam=localStorage.getItem('scam')==='1'}catch(e){}
$('scam').checked=scam;document.body.classList.toggle('scam',scam);
$('scam').addEventListener('change',function(){scam=this.checked;document.body.classList.toggle('scam',scam);
 try{localStorage.setItem('scam',scam?'1':'0')}catch(e){}
 info();calc(last)});
info();load();
</script></body></html>
